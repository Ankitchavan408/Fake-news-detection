<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Prediction Result</title>

    <style>
        :root {
            --bg: #fdf6ee;
            --card-bg: #ffffff;
            --primary: #7a1f2b;
            --text-main: #1f2933;
            --text-muted: #6b7280;
            --border: #e5e0d8;

            --real-bg: #e6f4ea;
            --real-text: #1e7f4f;

            --fake-bg: #fde8e8;
            --fake-text: #b42318;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                         Roboto, Inter, Helvetica, Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .card {
            width: 100%;
            max-width: 560px;
            padding: 48px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.06),
                0 2px 6px rgba(0, 0, 0, 0.04);
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 20px;
            letter-spacing: -0.02em;
        }

        .result {
            display: inline-block;
            padding: 14px 28px;
            border-radius: 999px;
            font-size: 18px;
            font-weight: 600;
            margin-bottom: 20px;
        }

        /* Flask will inject prediction text */
        .result.real {
            background: var(--real-bg);
            color: var(--real-text);
        }

        .result.fake {
            background: var(--fake-bg);
            color: var(--fake-text);
        }

        .description {
            font-size: 15px;
            color: var(--text-muted);
            margin-bottom: 36px;
        }

        a {
            display: inline-block;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 999px;
            text-decoration: none;
            background: var(--primary);
            color: #ffffff;
            transition: transform 0.15s ease,
                        box-shadow 0.15s ease,
                        background 0.15s ease;
        }

        a:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(122, 31, 43, 0.25);
            background: #a63a50;
        }

        footer {
            margin-top: 40px;
            font-size: 13px;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <main class="card">
        <h1>Prediction Result</h1>

        <!-- 
          Flask logic idea:
          If prediction == "Fake" → class="result fake"
          Else → class="result real"
        -->
        <div class="result {{ 'fake' if prediction == 'Fake' else 'real' }}">
            {{ prediction }}
        </div>

        <p class="description">
            This result is generated by our machine learning model based on
            language patterns and content signals.
        </p>

        <a href="/">Check another article</a>

        <footer>
            AI-Powered News Analysis
        </footer>
    </main>
</body>
</html>
